# Reusable: build, scan and (optionally) push the workspace images.
#
# Called by images.yml (push to main, push: true) and checks.yml
# (pull request, push: false). A tag that already exists in GHCR is skipped,
# so a pull request builds and scans only images with a new tag.

name: build-images

on:
  workflow_call:
    inputs:
      push:
        description: Push the images to GHCR
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        template: [node-js, php-wordpress, ops]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read image reference from main.tf
        id: ref
        env:
          TEMPLATE: ${{ matrix.template }}
        run: |
          image="$(scripts/image-ref.sh "$TEMPLATE/main.tf")"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Image: $image"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if the tag already exists
        id: exists
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
        run: |
          # Fails (exit 2) on registry errors: never build/push on a guess.
          state="$(scripts/image-state.sh "$IMAGE")"
          if [ "$state" = present ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag exists, nothing to build."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.exists.outputs.exists == 'false'

      - name: Build (load locally for the scan)
        if: steps.exists.outputs.exists == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.template }}/build
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.ref.outputs.image }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=coder-workspace-${{ matrix.template }}
          cache-from: type=gha,scope=${{ matrix.template }}
          cache-to: type=gha,mode=max,scope=${{ matrix.template }}

      - name: Scan with trivy (fail on fixable CRITICAL)
        if: steps.exists.outputs.exists == 'false'
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.75.0 image \
            --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 \
            --no-progress "$IMAGE"

      - name: Smoke test (tools, policy, code-server)
        if: steps.exists.outputs.exists == 'false'
        run: tests/smoke.sh "${{ matrix.template }}" "${{ steps.ref.outputs.image }}"

      - name: Push
        if: inputs.push && steps.exists.outputs.exists == 'false'
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
        run: docker push "$IMAGE"
