# Build workspace images and push them to GHCR.
#
# The image reference lives in <template>/main.tf (docker_image.workspace.name),
# e.g. ghcr.io/moveyourdigital/coder-workspace-node:v0.4.0
# A tag is built once. If it already exists in the registry, the job skips it
# (tags are immutable: change build/ => bump the tag in main.tf).
# The steps are in build-images.yml (shared with checks.yml).

name: images

on:
  push:
    branches: [main]
    paths:
      - "*/build/**"
      - "*/main.tf"
      - ".github/workflows/images.yml"
      - ".github/workflows/build-images.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-images.yml
    with:
      push: true
