# Build workspace images and push them to GHCR.
#
# The image reference lives in <template>/main.tf (docker_image.workspace.name),
# e.g. ghcr.io/moveyourdigital/coder-workspace-node:v0.4.0
# A tag is built once. If it already exists in the registry, the job skips it
# (tags are immutable: change build/ => bump the tag in main.tf).

name: images

on:
  push:
    branches: [main]
    paths:
      - "*/build/**"
      - "*/main.tf"
      - ".github/workflows/images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        template: [node-js, php-wordpress, ops]

    steps:
      - uses: actions/checkout@v4

      - name: Read image reference from main.tf
        id: ref
        run: |
          image="$(grep -oE 'ghcr\.io/moveyourdigital/coder-workspace-[a-z-]+:[^"]+' "${{ matrix.template }}/main.tf" | head -1)"
          if [ -z "$image" ]; then
            echo "::error::No ghcr.io image reference in ${{ matrix.template }}/main.tf"
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Image: $image"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if the tag already exists
        id: exists
        run: |
          if docker manifest inspect "${{ steps.ref.outputs.image }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag exists, nothing to build."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.exists.outputs.exists == 'false'

      - name: Build (load locally for the scan)
        if: steps.exists.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.template }}/build
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.ref.outputs.image }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=coder-workspace-${{ matrix.template }}
          cache-from: type=gha,scope=${{ matrix.template }}
          cache-to: type=gha,mode=max,scope=${{ matrix.template }}

      - name: Scan with trivy (fail on fixable CRITICAL)
        if: steps.exists.outputs.exists == 'false'
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.75.0 image \
            --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 \
            --no-progress "${{ steps.ref.outputs.image }}"

      - name: Push
        if: steps.exists.outputs.exists == 'false'
        run: docker push "${{ steps.ref.outputs.image }}"
