# Checks for pull requests to main. Read-only: nothing is pushed.
#
#   checks     just lint + just validate (tools from .mise.toml)
#   image-tag  a change under build/ needs a new tag that is not in GHCR
#   images     build and trivy-scan images with a new tag (no push)
#
# scan.yml starts it with workflow_dispatch on its security PR branch: a PR
# opened with GITHUB_TOKEN starts no workflows, but a dispatch does. The job
# names are the same, so the results count as the PR's required checks.

name: checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base:
        description: Base commit (SHA) to compare with, for check-tags
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
      - run: just lint
        env:
          GH_TOKEN: ${{ github.token }}   # zizmor online audits
      - run: just validate

  image-tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: just check-tags
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base }}
        run: |
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::base must be a commit SHA"; exit 1; }
          just check-tags "$BASE_SHA"

  images:
    uses: ./.github/workflows/build-images.yml
    with:
      push: false
