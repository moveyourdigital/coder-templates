# Checks for pull requests to main. Read-only: nothing is pushed.
#
#   checks     just lint + just validate (tools from .mise.toml)
#   image-tag  a change under build/ needs a new tag that is not in GHCR
#   images     build and trivy-scan images with a new tag (no push)

name: checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

concurrency:
  group: checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5.0.0
      - run: just lint
      - run: just validate

  image-tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5.0.0
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: just check-tags "${{ github.event.pull_request.base.sha }}"

  images:
    uses: ./.github/workflows/build-images.yml
    with:
      push: false
