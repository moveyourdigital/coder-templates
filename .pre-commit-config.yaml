# Uses tools installed by mise in the ops workspace (language: system).
repos:
  - repo: local
    hooks:
      - id: terraform-fmt
        name: terraform fmt
        entry: terraform fmt -check -recursive
        language: system
        pass_filenames: false
        files: \.tf$
      - id: hadolint
        name: hadolint
        entry: hadolint
        language: system
        files: Dockerfile$
      - id: json-valid
        name: JSON syntax
        entry: python3 -m json.tool
        language: system
        files: \.json$
      - id: gitleaks
        name: gitleaks
        entry: gitleaks git --staged --no-banner --redact
        language: system
        pass_filenames: false
