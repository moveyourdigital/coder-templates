# Uses tools installed by mise in the ops workspace (language: system).
repos:
  - repo: local
    hooks:
      - id: terraform-fmt
        name: terraform fmt
        entry: terraform fmt -check -recursive
        language: system
        pass_filenames: false
        files: \.tf$
      - id: hadolint
        name: hadolint
        entry: hadolint
        language: system
        files: Dockerfile$
      - id: json-valid
        name: JSON syntax
        # json.tool takes [infile] [outfile]: never pass it several files.
        entry: python3 -c 'import json, sys; [json.load(open(f)) for f in sys.argv[1:]]'
        language: system
        files: \.json$
      - id: gitleaks
        name: gitleaks
        entry: gitleaks git --staged --no-banner --redact
        language: system
        pass_filenames: false
